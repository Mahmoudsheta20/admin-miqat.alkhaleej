<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Shadow filter -->
    <filter id="vatShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
    <clipPath id="vatCardClip">
      <rect x="4" y="4" width="92" height="112" rx="8" />
    </clipPath>
  </defs>

  <!-- Card container with border and shadow -->
  <g filter="url(#vatShadow)">
    <!-- Base card -->
    <rect x="4" y="4" width="92" height="112" rx="8" fill="#00573e" stroke="#003d2b" stroke-width="2" />
    
    <g clip-path="url(#vatCardClip)">
      <!-- Top Section: Dark Green background with Arabic Typography -->
      <rect x="4" y="4" width="92" height="74" fill="#00573e" />
      
      <!-- Arabic Text: ضريبة القيمة المضافة -->
      <text x="50" y="27" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">ضريبة</text>
      <text x="50" y="47" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="0.5">القيمة</text>
      <text x="50" y="67" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, Arial, sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="0.5">المضافة</text>

      <!-- Bottom Section: Official Gold/Yellow VAT Bar -->
      <rect x="4" y="76" width="92" height="40" fill="#e69d00" stroke="#c88700" stroke-width="1" />
      
      <!-- VAT Typography with Checkmark in 'A' -->
      <!-- 'V' -->
      <text x="25" y="104" fill="#004d36" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">V</text>
      
      <!-- 'A' Base -->
      <text x="50" y="104" fill="#004d36" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">A</text>
      <!-- Green Checkmark on 'A' -->
      <path d="M46 95 L49 98 L55 90" fill="none" stroke="#007a53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

      <!-- 'T' -->
      <text x="75" y="104" fill="#004d36" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">T</text>
    </g>
  </g>
</svg>
